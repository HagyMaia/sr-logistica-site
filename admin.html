<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | SR Logística</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 6rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--text-muted);
            border-radius: 4px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .posts-list {
            margin-top: 3rem;
        }
        .post-item {
            background: var(--bg-light);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #c82333;
        }
    </style>
</head>

<body>
    <!-- Navbar (Sticky) -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">SR Logística Admin</div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-arrow-left"></i> Voltar ao Site</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Login Container -->
        <div class="admin-container" id="login-container">
            <div class="admin-header">
                <h2>Acesso Restrito</h2>
                <p>Faça login para gerenciar as informações.</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="admin-user">E-mail</label>
                    <input type="email" id="admin-user" required placeholder="seu-email@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="admin-password">Senha</label>
                    <input type="password" id="admin-password" required placeholder="Sua senha">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                    <a href="#" id="forgot-password" style="color: var(--primary-light); font-size: 0.9rem; text-decoration: none;">Esqueceu a senha?</a>
                </div>
            </form>
        </div>

        <!-- Dashboard Container (Hidden by default) -->
        <div class="admin-container" id="dashboard-container" style="display: none;">
            <div class="admin-header">
                <div>
                    <h2>Gerenciar Informações</h2>
                    <p>Modo de Edição Local (Preparado para App)</p>
                </div>
                <button id="btn-change-password" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.5rem 1rem;"><i class="fas fa-key"></i> Trocar Senha</button>
            </div>

            <form id="admin-form">
                <div class="form-group">
                    <label for="post-type">Tipo de Postagem</label>
                    <select id="post-type" required>
                        <option value="promo">Promoção (Ex: Desconto em corrida)</option>
                        <option value="info">Aviso (Ex: Novo veículo na frota)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="post-title">Título</label>
                    <input type="text" id="post-title" required placeholder="Ex: Oferta Especial 10% OFF">
                </div>
                <div class="form-group">
                    <label for="post-content">Conteúdo</label>
                    <textarea id="post-content" required placeholder="Descreva os detalhes aqui..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Adicionar Postagem</button>
            </form>

            <div class="posts-list">
                <h3>Postagens Atuais</h3>
                <div id="posts-container">
                    <!-- Posts carregados via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('admin-form');
            const postsContainer = document.getElementById('posts-container');
            const loginContainer = document.getElementById('login-container');
            const dashboardContainer = document.getElementById('dashboard-container');
            const loginForm = document.getElementById('login-form');
            
            // Check theme to keep it consistent
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
            
            if(SUPABASE_URL === 'SUA_SUPABASE_PROJECT_URL_AQUI') {
                 alert('⚠️ Você precisa configurar as chaves do Supabase no arquivo supabase-config.js para o painel funcionar!');
                 return;
            }

            // --- FUNÇÕES DO SUPABASE ---

            const loadPosts = async () => {
                postsContainer.innerHTML = '<p>Carregando...</p>';
                const { data: infoData, error } = await supabase
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error(error);
                    postsContainer.innerHTML = '<p>Erro ao carregar postagens.</p>';
                    return;
                }

                if (!infoData || infoData.length === 0) {
                    postsContainer.innerHTML = '<p>Nenhuma postagem cadastrada.</p>';
                    return;
                }

                postsContainer.innerHTML = infoData.map(item => `
                    <div class="post-item">
                        <div>
                            <strong>[${item.type === 'promo' ? 'Promoção' : 'Aviso'}]</strong> ${item.title}
                        </div>
                        <button class="delete-btn" onclick="deletePost('${item.id}')"><i class="fas fa-trash"></i> Remover</button>
                    </div>
                `).join('');
            };

            window.deletePost = async (id) => {
                if (confirm('Tem certeza que deseja remover esta postagem?')) {
                    const { error } = await supabase.from('posts').delete().eq('id', id);
                    if (error) {
                        alert('Erro ao remover: ' + error.message);
                    } else {
                        loadPosts();
                    }
                }
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const type = document.getElementById('post-type').value;
                const title = document.getElementById('post-title').value;
                const content = document.getElementById('post-content').value;
                
                const { error } = await supabase.from('posts').insert([{ type, title, content }]);
                
                if (error) {
                    alert('Erro ao adicionar postagem: ' + error.message);
                } else {
                    form.reset();
                    loadPosts();
                    alert('Postagem adicionada com sucesso! Ela já está visível no site principal.');
                }
            });

            // --- AUTENTICAÇÃO COM SUPABASE ---

            // Verifica se já está logado
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                loginContainer.style.display = 'none';
                dashboardContainer.style.display = 'block';
                loadPosts();
            }

            // Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('admin-user').value;
                const password = document.getElementById('admin-password').value;
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    alert('Erro no login: ' + error.message);
                } else {
                    loginContainer.style.display = 'none';
                    dashboardContainer.style.display = 'block';
                    loadPosts();
                }
            });

            // Forgot Password
            const forgotPasswordLink = document.getElementById('forgot-password');
            if(forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('admin-user').value;
                    if (!email) {
                        alert('Por favor, digite seu e-mail no campo acima primeiro.');
                        return;
                    }
                    
                    const { error } = await supabase.auth.resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + '/admin.html',
                    });
                    
                    if (error) {
                        alert('Erro ao enviar e-mail de recuperação: ' + error.message);
                    } else {
                        alert('Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.');
                    }
                });
            }

            // Botão "Sair" (Logout)
            const btnChangePassword = document.getElementById('btn-change-password');
            if(btnChangePassword) {
                btnChangePassword.innerHTML = '<i class="fas fa-sign-out-alt"></i> Sair do Painel';
                btnChangePassword.addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    window.location.reload();
                });
            }
        });
    </script>
</body>
</html>
