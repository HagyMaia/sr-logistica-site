<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel de Administração da SR Logística">
    <title>Painel Admin | SR Logística</title>

    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos exclusivos do admin -->
    <link rel="stylesheet" href="admin-styles.css">
</head>

<body>
    <header>
        <nav class="navbar" aria-label="Navegação principal">
            <div class="container nav-container">
                <div class="logo">SR Logística Admin</div>
                <ul class="nav-links">
                    <li><a href="index.html" aria-label="Voltar para a página inicial"><i class="fas fa-arrow-left"></i>
                            Voltar ao Site</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Seção de Login -->
        <section class="admin-container" id="login-container" aria-labelledby="login-title">
            <header class="admin-header">
                <div>
                    <h1 id="login-title">Acesso Restrito</h1>
                    <p>Faça login para gerenciar as informações.</p>
                </div>
            </header>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="admin-user">E-mail</label>
                    <input type="email" id="admin-user" required placeholder="seu-email@exemplo.com"
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="admin-password">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="admin-password" required placeholder="Sua senha"
                            aria-required="true">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Entrar
                    </button>
                    <a href="#" id="forgot-password" class="forgot-link">Esqueceu a senha?</a>
                </div>
                <div id="login-feedback" class="feedback-msg" aria-live="polite"></div>
            </form>
        </section>

        <!-- Seção do Dashboard (Oculta inicialmente) -->
        <section class="admin-container hidden" id="dashboard-container" aria-labelledby="dashboard-title">
            <header class="admin-header">
                <div>
                    <h1 id="dashboard-title">Gerenciar Informações</h1>
                    <p>Painel de Controle Integrado ao Supabase</p>
                </div>
                <button id="btn-logout" class="btn btn-outline" aria-label="Sair da conta">
                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair do Painel
                </button>
            </header>

            <form id="admin-form" novalidate>
                <div class="form-group">
                    <label for="post-type">Tipo de Postagem</label>
                    <select id="post-type" required aria-required="true">
                        <option value="promo">Promoção (Ex: Desconto em corrida)</option>
                        <option value="info">Aviso (Ex: Novo veículo na frota)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="post-title">Título</label>
                    <input type="text" id="post-title" required placeholder="Ex: Oferta Especial 10% OFF"
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="post-content">Conteúdo</label>
                    <textarea id="post-content" required placeholder="Descreva os detalhes aqui..."
                        aria-required="true"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-add-post">
                    <i class="fas fa-plus" aria-hidden="true"></i> Adicionar Postagem
                </button>
                <div id="post-feedback" class="feedback-msg" aria-live="polite"></div>
            </form>

            <section class="posts-list" aria-labelledby="posts-title">
                <h2 id="posts-title">Postagens Atuais</h2>
                <div id="posts-container" aria-live="polite">
                    <!-- Posts injetados via JavaScript -->
                </div>
            </section>
        </section>
    </main>

    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script exclusivo do admin -->
    <script src="admin-script.js"></script>
</body>

</html>
